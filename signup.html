<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up - AL-QUWwA HOME MARKETPLACE</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      ```
      <div class="logo">AL-QUWWA HOME MARKETPLACE</div>

      <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </nav>
      ```
    </header>

    <main>
      ```
      <section class="section">
        <h2>Create Your Account</h2>

        <p class="section-intro">
          Join AL-QUWWA HOME MARKETPLACE and connect with properties, assets and
          investment opportunities.
        </p>

        <form id="signupForm" class="asset-form">
          <input type="text" id="signupName" placeholder="Full Name" required />

          <input
            type="email"
            id="signupEmail"
            placeholder="Email Address"
            required
          />

          <input
            type="tel"
            id="signupPhone"
            placeholder="Phone Number"
            required
          />

          <select id="signupRole" required>
            <option value="">Select Account Type</option>
            <option value="Buyer">Buyer</option>
            <option value="Seller">Seller</option>
            <option value="Investor">Investor</option>
          </select>

          <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            required
          />

          <input
            type="password"
            id="signupConfirmPassword"
            placeholder="Confirm Password"
            required
          />

          <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <p id="signupMessage"></p>
      </section>
      ```
    </main>

    <footer>
      ```
      <p>© 2026 AL-QUWwA HOME MARKETPLACE. All Rights Reserved.</p>
      ```
    </footer>

    <script>
      const signupForm = document.getElementById("signupForm");
      const signupMessage = document.getElementById("signupMessage");

      signupForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const phone = document.getElementById("signupPhone").value.trim();
        const role = document.getElementById("signupRole").value;
        const password = document.getElementById("signupPassword").value;
        const confirmPassword = document.getElementById(
          "signupConfirmPassword",
        ).value;

        // Check passwords
        if (password !== confirmPassword) {
          signupMessage.textContent = "Passwords do not match.";
          return;
        }

        signupMessage.textContent = "Creating your account...";

        try {
          const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name,
              email,
              phone,
              role,
              password,
            }),
          });

          const result = await response.json();

          if (!response.ok) {
            signupMessage.textContent = result.message;
            return;
          }

          signupMessage.textContent =
            "Account created successfully! Redirecting to Login...";

          signupForm.reset();

          setTimeout(function () {
            window.location.href = "login.html";
          }, 1000);
        } catch (error) {
          console.error("Signup error:", error);

          signupMessage.textContent =
            "Unable to connect to the server. Please try again.";
        }
      });
    </script>
  </body>
</html>
