<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - AL-QUWwA HOME MARKETPLACE</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">AL-QUWAH HOME MARKETPLACE</div>

      <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="signup.html">Sign Up</a>
      </nav>
      ```
    </header>

    <main>
      ```
      <section class="section">
        <h2>Login to Your Account</h2>

        <p class="section-intro">Welcome back to AL-QUWWA HOME MARKETPLACE.</p>

        <form id="loginForm" class="asset-form">
          <input
            type="email"
            id="loginEmail"
            placeholder="Email Address"
            required
          />

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />

          <button type="submit" class="primary-btn">Login</button>
        </form>

        <p id="loginMessage"></p>

        <p>
          Don't have an account?
          <a href="signup.html">Create an account</a>
        </p>
      </section>
      ```
    </main>

    <footer>
      ```
      <p>© 2026 ALL-QUWAA HOME MARKETPLACE. All Rights Reserved.</p>
      ```
    </footer>

    <script>
      const loginForm = document.getElementById("loginForm");
      console.log("LOGIN JAVASCRIPT IS RUNNING");
      const loginMessage = document.getElementById("loginMessage");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("loginEmail").value.trim();

        const password = document.getElementById("loginPassword").value;

        loginMessage.textContent = "Logging in...";

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const result = await response.json();

          if (!response.ok) {
            loginMessage.textContent = result.message;
            return;
          }

          // Save logged-in user for the marketplace
          localStorage.setItem("loggedInUser", JSON.stringify(result.user));

          loginMessage.textContent = "Login successful! Redirecting...";

          setTimeout(function () {
            window.location.href = "index.html";
          }, 1000);
        } catch (error) {
          console.error("Login error:", error);

          loginMessage.textContent =
            "Unable to connect to the server. Please try again.";
        }
      });
    </script>
  </body>
</html>
